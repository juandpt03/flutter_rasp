name: flutter_rasp_example
description: "Demonstrates how to use the flutter_rasp plugin."
publish_to: 'none'
version: 7.2.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_rasp:
    path: ../
  dio: ^5.11.1
  http: ^1.6.0
  material_ui: ^1.4.0

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  config:
    enable-swift-package-manager: true
  # Bundle the icon font used by material_ui Icons.
  uses-material-design: true
  assets:
    - assets/certs/
